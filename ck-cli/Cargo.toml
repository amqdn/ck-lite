[package]
name = "ck-search"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fast, lightweight regex grep tool with gitignore awareness"
repository = "https://github.com/BeaconBay/ck"
keywords = ["grep", "search", "regex", "code", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ck"
path = "src/main.rs"

[lib]
name = "ck_search"
path = "src/lib.rs"

[dependencies]
ck-core = { workspace = true }
ck-index = { workspace = true }
ck-engine = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
glob = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
console = { workspace = true }
owo-colors = { workspace = true }
walkdir = { workspace = true }
dirs = "6.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }

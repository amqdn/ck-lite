[workspace]
resolver = "2"
members = [
    "ck-cli",
    "ck-core",
    "ck-index",
    "ck-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mike Renwick"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/amqdn/ck-lite"
rust-version = "1.88.0"

[workspace.dependencies]
ck-core = { path = "ck-core" }
ck-index = { path = "ck-index" }
ck-engine = { path = "ck-engine" }

anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
regex = "1.12"
rayon = "1.12"
walkdir = "2.4"
glob = "0.3"
globset = "0.4"
ignore = "0.4"
console = "0.15"
tracing = "0.1"
tempfile = "3.27"
